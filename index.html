<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Animated Website</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>

<body>

  <!-- Header -->
  <header class="header">

    <!-- Navbar -->
    <nav class="navbar container">

      <div class="logo fade-top">
        Nexa
      </div>

      <ul class="nav-links">
        <li class="fade-top delay-1"><a href="#">Home</a></li>
        <li class="fade-top delay-2"><a href="#">About</a></li>
        <li class="fade-top delay-3"><a href="#">Services</a></li>
        <li class="fade-top delay-4"><a href="#">Contact</a></li>
      </ul>

      <!-- Mobile Menu -->
      <div class="menu-btn" id="menu-btn">
        ☰
      </div>

    </nav>

    <!-- Hero Section -->
    <section class="hero container">

      <!-- Left -->
      <div class="hero-content">

        <p class="hero-subtitle fade-left delay-1">
          MODERN DIGITAL EXPERIENCE
        </p>

        <h1 class="hero-title fade-left delay-2">
          Build Stunning
          Animated Websites
        </h1>

        <p class="hero-description fade-left delay-3">
          Create modern and interactive user experiences
          using HTML, CSS, and JavaScript animations
          with smooth transitions and professional layouts.
        </p>

        <div class="hero-buttons fade-left delay-4">
          <a href="#" class="btn-primary">
            Get Started
          </a>

          <a href="#" class="btn-secondary">
            Learn More
          </a>
        </div>

      </div>

      <!-- Right -->
      <div class="hero-image fade-right delay-5">

        <div class="circle"></div>

        <img
          src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=2072&auto=format&fit=crop"
          alt="Developer"
        />

      </div>

    </section>

  </header>

  <script src="script.js"></script>

</body>

</html>
